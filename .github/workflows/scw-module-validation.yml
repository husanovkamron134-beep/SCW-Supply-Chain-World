name: SCW module validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/warehouse-3d-world]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run end-to-end module simulation
        run: node scripts/test_scw_modules.cjs
