name: SCW quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inventory domain syntax
        run: node --check src/domain.js
      - name: Check operations domain syntax
        run: node --check src/operations.js
      - name: Run domain tests
        run: node --test tests/*.test.js
