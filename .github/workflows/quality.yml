name: SCW quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check domain syntax
        run: node --check src/domain.js && node --check src/operations.js && node --check src/transport.js && node --check src/production.js && node --check src/planning.js && node --check src/network.js && node --check src/digital_twin.js && node --check src/warehouse_sim.js && node --check src/intelligence.js
      - name: Run domain tests
        run: node --test tests/*.test.js

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Run backend API tests
        run: pytest -q
